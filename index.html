<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ariff — Trainer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0d12;
    background-image:
      radial-gradient(600px circle at 20% 10%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(600px circle at 85% 90%, rgba(168,85,247,.10), transparent 60%);
    color: #e6e9ef;
  }

  .kad {
    width: min(380px, 100%);
    padding: 40px 32px;
    text-align: center;
    background: #12151d;
    border: 1px solid #232937;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }

  .avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #0b0d12;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
  }

  h1 {
    font-size: 26px;
    letter-spacing: -.4px;
  }

  .peranan {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #38bdf8;
  }

  .garis {
    height: 1px;
    margin: 24px 0;
    background: #232937;
  }

  .label {
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #7b8497;
  }

  .tag {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 16px;
    font-size: 14px;
    font-weight: 600;
    color: #7dd3fc;
    background: rgba(56,189,248,.10);
    border: 1px solid rgba(56,189,248,.28);
    border-radius: 999px;
  }

  .fakta {
    margin-top: 24px;
  }

  .fakta p {
    margin-top: 10px;
    font-size: 15px;
    line-height: 1.6;
    color: #b6bece;
  }
</style>
</head>
<body>

  <main class="kad">
    <div class="avatar">A</div>
    <h1>Ariff</h1>
    <p class="peranan">Trainer</p>

    <div class="garis"></div>

    <p class="label">Kemahiran</p>
    <span class="tag">DevOps</span>

    <div class="fakta">
      <p class="label">Fakta Menarik</p>
      <p>Seorang ayah. 👨‍👧</p>
    </div>
  </main>

</body>
</html>
